name: CI

on:
  push:
  pull_request:

env:
  # Bootstrap-then-migrate, matching docker-compose and production (Appendix
  # A's quick-start order, Spec 8.2) — CI no longer runs a different order
  # than every other environment. It used to: migrate-then-bootstrap worked
  # here (and only here) because the Postgres service's POSTGRES_USER makes
  # ems_owner a real superuser at container init, which already owns this
  # database and its public schema, so `alembic upgrade head` could create
  # tables with no bootstrap step first. That stopped being sufficient the
  # moment a migration needed a ROLE to already exist, not just schema
  # ownership: WP-11's 6f86b03e8caa runs `REVOKE UPDATE, DELETE ON
  # audit_logs FROM ems_app`, and `ems_app` doesn't exist until
  # bootstrap_roles.sql creates it. No amount of ems_owner's superuser
  # privilege makes REVOKE ... FROM a role that isn't there yet succeed —
  # this was a correctness gap in the ordering, not a permissions gap, and
  # was going to break the first time any migration referenced ems_app by
  # name. Verified (not assumed) that bootstrapping first still works now:
  # a fresh Postgres 16 cluster initialized the same way the postgres:16
  # image does for POSTGRES_USER=ems_owner (initdb --username=ems_owner,
  # making it a genuine superuser) ran bootstrap_roles.sql cleanly against
  # an empty, freshly created database with zero tables — CREATE ROLE,
  # ALTER SCHEMA public OWNER, the GRANTs and ALTER DEFAULT PRIVILEGES all
  # succeed before any table exists, because none of them require one to.
  # `alembic upgrade head` then ran clean afterward, including the
  # audit_logs REVOKE, because ems_app already existed. Reproduced in full
  # (see the commit this comment shipped with for the actual command
  # output) rather than assumed from the docker-compose/production case.
  #
  # ems_owner's password comes from the Postgres service container's own
  # POSTGRES_PASSWORD below (it already exists as the container's bootstrap
  # superuser). ems_app doesn't exist until bootstrap_roles.sql creates it,
  # hardcoded there as ems_app_dev_only — this must match that file's
  # literal value, not an independently-chosen CI secret.
  #
  # DATABASE_URL and TEST_DATABASE_URL must name DIFFERENT databases —
  # conftest.py refuses to run otherwise (15.2's "never run tests against
  # the development database" guard). The Postgres service container only
  # ever provisions ems_pro_test (POSTGRES_DB below); DATABASE_URL naming
  # "ems_pro" here doesn't need that database to exist — nothing in CI
  # actually connects through it. SQLAlchemy's create_engine() is lazy
  # (app/db/session.py), so Settings() only needs a syntactically valid,
  # differently-named URL to satisfy the guard, never a live connection.
  PGHOST: localhost
  PGPORT: 5432
  PGUSER: ems_owner
  PGPASSWORD: ci_ems_owner_only
  PGDATABASE: ems_pro_test
  # scripts/setup.sh's own bootstrap role — see its header. In CI this is
  # ems_owner itself (already a superuser via the service container's own
  # POSTGRES_USER); locally it defaults to your OS username instead, since
  # ems_owner doesn't exist yet the first time setup.sh runs there.
  PG_BOOTSTRAP_USER: ems_owner
  PG_BOOTSTRAP_PASSWORD: ci_ems_owner_only
  ALEMBIC_DATABASE_URL: postgresql+psycopg2://ems_owner:ci_ems_owner_only@localhost:5432/ems_pro_test
  DATABASE_URL: postgresql+psycopg2://ems_app:ems_app_dev_only@localhost:5432/ems_pro
  TEST_DATABASE_URL: postgresql+psycopg2://ems_app:ems_app_dev_only@localhost:5432/ems_pro_test
  TEST_MIGRATION_URL: postgresql+psycopg2://ems_owner:ci_ems_owner_only@localhost:5432/ems_pro_test
  REDIS_URL: redis://localhost:6379/0
  SECRET_KEY: ci_only_secret_key_not_a_real_secret
  ENVIRONMENT: staging

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ems_owner
          POSTGRES_PASSWORD: ci_ems_owner_only
          POSTGRES_DB: ems_pro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ems_owner -d ems_pro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # 1. Checkout, set up Python 3.12
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # 2. Install dependencies (cached)
      - name: Install dependencies
        run: pip install -e ".[dev]"

      # 3. Lint
      - name: ruff check
        run: ruff check .

      # 4. Formatting
      - name: ruff format --check
        run: ruff format --check .

      # 5. Type check (advisory — allowed to fail early on, tightened later)
      - name: mypy
        run: mypy app/ || true

      # 6. Postgres + Redis are already up as service containers above.
      - name: Wait for Postgres and Redis
        run: |
          pg_isready -h localhost -p 5432 -U ems_owner -d ems_pro_test
          python -c "import redis; redis.Redis.from_url('redis://localhost:6379/0').ping(); print('redis: PONG')"

      # 7-8. Bootstrap ems_app + grants, then migrate — via scripts/setup.sh,
      # not a separate copy of the same sequence. That's the whole point
      # (WP-15): CI and a developer's machine run the identical script, so
      # they cannot diverge the way this ordering did before. The database
      # already exists (POSTGRES_DB above), so setup.sh's own
      # create-if-absent step no-ops here; bootstrapping still runs before
      # migrating, which is why the audit_logs REVOKE now succeeds.
      - name: Set up database (scripts/setup.sh)
        run: scripts/setup.sh

      # 9. Tests as ems_app, so RLS is genuinely exercised once it exists (WP-04+).
      - name: pytest
        run: pytest -v --cov=app --cov-report=term-missing

      # 10. Frontend — landed in WP-12/WP-13. openapi-typescript's generated
      # output is committed (Spec 14.5), so CI never needs a running backend
      # to type-check the frontend against it. `npm ci`, not `npm install` —
      # fails loudly if package-lock.json ever drifts from package.json,
      # instead of silently resolving around it.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend build (tsc -b && vite build)
        working-directory: frontend
        run: npm run build
